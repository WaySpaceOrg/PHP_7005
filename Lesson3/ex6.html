<body><div class="shell"><header class="topbar"><div class="brand"><div class="mark" aria-hidden="true">&lt;/&gt;</div><div><h1>PHP_7005</h1><p>Web Development Practice Project</p></div></div><a class="back" href="../index.html">← กลับหน้าหลัก</a></header>
<main><section class="hero"><p class="eyebrow">LESSON 03 · EXERCISE 06</p><h2>คำนวณ BMI ✨</h2><p>แบบฝึกหัดการพัฒนาเว็บไซต์ · PHP_7005</p></section><section class="panel"><h2>คำนวณ BMI</h2>
<label for="weight">น้ำหนัก (กก.)</label>
<input id="weight" type="number" min="0" step="any" placeholder="เช่น 65">
<label for="height">ส่วนสูง (ซม.)</label>
<input id="height" type="number" min="0" step="any" placeholder="เช่น 170">
<button id="calc" type="button">คำนวณ BMI</button>
<p id="result" aria-live="polite"></p>
<script>
document.getElementById("calc").addEventListener("click", function () {
 const weightInput = document.getElementById("weight").value.trim();
 const heightInput = document.getElementById("height").value.trim();
 const weight = parseFloat(weightInput);
 const heightCm = parseFloat(heightInput);
 if (weightInput === "" || heightInput === "" || !Number.isFinite(weight) || !Number.isFinite(heightCm) || weight <= 0 || heightCm <= 0) {
  document.getElementById("result").textContent = "กรุณากรอกน้ำหนักและส่วนสูงให้ถูกต้อง";
  return;
 }
 const bmi = weight / Math.pow(heightCm / 100, 2);
 let category = bmi < 18.5 ? "น้ำหนักน้อย" : bmi < 25 ? "ปกติ" : "น้ำหนักเกิน";
 document.getElementById("result").textContent = "BMI " + bmi.toFixed(1) + " (" + category + ")";
});
</script></section><div class="bottom"><a href="../index.html">← กลับไปยังหน้าแรก</a></div></main></div>
